<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" width="1000" height="660" role="img" aria-labelledby="fig01-title fig01-desc">
  <title id="fig01-title">FIG.01 · Plan, implement, validate, 2026</title>
  <desc id="fig01-desc">Three stages on one line. At Plan, two humans decide what to build and one agent helps. At Implement, agents work on two or three tasks in parallel, started one after another. At Validate, two agents test and review first and one human decides what ships. A bracket under Implement marks agent execution time as the time the human uses to start more tasks. Rejected work goes back to planning. Humans are drawn as solid filled circles, agents as dashed outline circles.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ebecee" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#17181c"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e8472b"/>
    </marker>
    <style>
      .mono{font-family:"IBM Plex Mono",ui-monospace,monospace;letter-spacing:.08em}
      .serif{font-family:"Playfair Display",Georgia,serif}
      .body{font-family:"Source Serif 4",Georgia,serif}
      .human{fill:#e8472b;stroke:#17181c;stroke-width:1.5}
      .agent{fill:#f3f4f6;stroke:#17181c;stroke-width:2;stroke-dasharray:5 4}
    </style>
  </defs>

  <!-- paper, grid and corner marks -->
  <rect width="1000" height="660" fill="#f3f4f6"/>
  <rect width="1000" height="660" fill="url(#grid)"/>
  <g stroke="#17181c" stroke-width="2" fill="none">
    <path d="M14 40V14H40"/>
    <path d="M960 14H986V40"/>
    <path d="M14 620V646H40"/>
    <path d="M960 646H986V620"/>
  </g>

  <!-- header -->
  <text x="40" y="52" class="mono" font-size="16" fill="#6b7a90">FIG.01 · PLAN, IMPLEMENT, VALIDATE</text>
  <text x="960" y="52" class="mono" font-size="16" fill="#6b7a90" text-anchor="end">KIBILKO.PL</text>
  <text x="40" y="100" class="serif" font-size="38" font-weight="700" fill="#17181c">The human owns the <tspan font-style="italic" fill="#c8381e">edges</tspan></text>
  <line x1="40" y1="122" x2="960" y2="122" stroke="#17181c" stroke-width="1.5"/>

  <!-- legend -->
  <text x="40" y="157" class="mono" font-size="14" fill="#6b7a90">LEGEND</text>
  <circle cx="132" cy="152" r="10" class="human"/>
  <text x="150" y="157" class="mono" font-size="14" font-weight="600" fill="#17181c">HUMAN</text>
  <circle cx="232" cy="152" r="10" class="agent"/>
  <text x="250" y="157" class="mono" font-size="14" font-weight="600" fill="#17181c">AGENT</text>

  <!-- stage titles on one line -->
  <g class="mono" font-size="14" fill="#c8381e" text-anchor="middle">
    <text x="170" y="200">STEP 01</text>
    <text x="500" y="200">STEP 02</text>
    <text x="830" y="200">STEP 03</text>
  </g>
  <g class="serif" font-size="32" font-weight="700" fill="#17181c" text-anchor="middle">
    <text x="170" y="238">Plan</text>
    <text x="500" y="238">Implement</text>
    <text x="830" y="238">Validate</text>
  </g>
  <g stroke="#17181c" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M216 227H396"/>
    <path d="M606 227H752"/>
  </g>

  <!-- 01 plan: two humans, one agent helping -->
  <circle cx="110" cy="312" r="22" class="human"/>
  <circle cx="170" cy="312" r="22" class="human"/>
  <circle cx="230" cy="312" r="22" class="agent"/>
  <g class="body" font-size="18" fill="#17181c" text-anchor="middle">
    <text x="170" y="386">People decide what to build,</text>
    <text x="170" y="410">an agent helps with the plan</text>
  </g>

  <!-- 02 implement: two or three tasks, started one after another -->
  <g>
    <circle cx="384" cy="272" r="14" class="agent"/>
    <text x="406" y="277" class="mono" font-size="13" fill="#6b7a90">TASK 1</text>
    <path d="M470 272H632" stroke="#17181c" stroke-width="3" stroke-dasharray="10 6"/>
  </g>
  <g>
    <circle cx="424" cy="312" r="14" class="agent"/>
    <text x="446" y="317" class="mono" font-size="13" fill="#6b7a90">TASK 2</text>
    <path d="M510 312H632" stroke="#17181c" stroke-width="3" stroke-dasharray="10 6"/>
  </g>
  <g>
    <circle cx="464" cy="352" r="14" class="agent"/>
    <text x="486" y="357" class="mono" font-size="13" fill="#6b7a90">TASK 3</text>
    <path d="M550 352H632" stroke="#17181c" stroke-width="3" stroke-dasharray="10 6"/>
  </g>

  <!-- plan fans out to tasks, tasks converge on validation -->
  <g stroke="#17181c" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M254 312C300 312 320 272 366 272"/>
    <path d="M254 312C320 312 360 312 406 312"/>
    <path d="M254 312C330 312 400 352 446 352"/>
    <path d="M632 272C690 272 700 312 744 312"/>
    <path d="M632 312H744"/>
    <path d="M632 352C690 352 700 312 744 312"/>
  </g>

  <!-- 03 validate: two agents first, a human decides -->
  <circle cx="770" cy="312" r="22" class="agent"/>
  <circle cx="830" cy="312" r="22" class="agent"/>
  <circle cx="890" cy="312" r="22" class="human"/>
  <g class="body" font-size="18" fill="#17181c" text-anchor="middle">
    <text x="830" y="386">Agents test and review first,</text>
    <text x="830" y="410">a person decides what ships</text>
  </g>

  <!-- bracket under implement: agent execution time -->
  <path d="M372 430V444H628V430M500 444V456" fill="none" stroke="#c8381e" stroke-width="2"/>
  <text x="500" y="482" class="mono" font-size="14" font-weight="600" fill="#c8381e" text-anchor="middle">AGENT EXECUTION TIME</text>
  <line x1="390" y1="494" x2="610" y2="494" stroke="#c8381e" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="500" y="518" class="body" font-size="18" fill="#17181c" text-anchor="middle">is when I start the next task</text>

  <!-- rejected work goes back to the plan -->
  <path d="M912 312H948V568H170V428" fill="none" stroke="#e8472b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow-accent)"/>
  <rect x="330" y="556" width="340" height="26" fill="#f3f4f6"/>
  <text x="500" y="574" class="mono" font-size="15" font-weight="600" fill="#c8381e" text-anchor="middle">REJECTED · BACK TO THE PLAN</text>

  <!-- footer -->
  <text x="500" y="620" class="mono" font-size="14" fill="#6b7a90" text-anchor="middle">A PERSON AT BOTH ENDS · AGENTS HELP AT EVERY STAGE</text>
</svg>
